<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slava_Gusak - Музыка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #d4d4d4;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
        }

        h1 {
            font-size: 4em;
            font-weight: 200;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 20px rgba(0, 0, 0, 0.7);
            background: linear-gradient(120deg, #ffffff, #a8a8a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: #888;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 60px;
        }

        .bio-text {
            font-size: 1.3em;
            line-height: 1.9;
            color: #9a9a9a;
            font-style: italic;
            text-align: center;
            margin: 60px auto;
            max-width: 600px;
            font-weight: 300;
        }

        .tracks {
            margin: 80px 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .track-item {
            opacity: 0;
            animation: slideIn 0.8s ease forwards;
        }

        .track-item:nth-child(1) { animation-delay: 0.2s; }
        .track-item:nth-child(2) { animation-delay: 0.4s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .track-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #b8b8b8;
            font-weight: 300;
            letter-spacing: 1px;
        }

        iframe {
            border-radius: 12px;
            width: 100%;
            filter: brightness(0.9);
            transition: filter 0.3s ease;
        }

        iframe:hover {
            filter: brightness(1);
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 100px 0 60px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            color: #c8c8c8;
            text-decoration: none;
            transition: all 0.4s ease;
            font-size: 1em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .link-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .link-btn svg {
            width: 22px;
            height: 22px;
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 60px 20px 40px;
            color: #5a5a5a;
            font-size: 0.85em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 60px auto;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.8em;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 1em;
            }

            .bio-text {
                font-size: 1.1em;
            }

            header {
                padding: 60px 20px 40px;
            }

            .links {
                flex-direction: column;
                align-items: stretch;
            }

            .link-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

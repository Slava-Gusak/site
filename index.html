<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slava_Gusak - Музыка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #d4d4d4;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Градиентный слой на весь экран */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 400px;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                rgba(0, 0, 0, 0.3) 30%,
                rgba(0, 0, 0, 0.6) 60%,
                rgba(0, 0, 0, 0.9) 100%);
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 0;
        }

        body.gradient-active::after {
            opacity: 1;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-in;
            position: relative;
            z-index: 1;
        }

        /* Переключатель языка */
        .lang-btn {
            position: absolute;
            top: 0;
            right: 0;
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .lang-btn:hover:not(.transitioning) {
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-btn.transitioning {
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Анимация затемнения */
        @keyframes fadeToBlack {
            0% {
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                opacity: 0.3;
                filter: brightness(0.3);
            }
            100% {
                opacity: 1;
                filter: brightness(1);
            }
        }

        .lang-btn.transitioning {
            animation: fadeToBlack 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
        }

        h1 {
            font-size: 4em;
            font-weight: 200;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 20px rgba(0, 0, 0, 0.7);
            background: linear-gradient(120deg, #ffffff, #a8a8a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: #888;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 60px;
        }

        .bio-text {
            font-size: 1.3em;
            line-height: 1.9;
            color: #9a9a9a;
            font-style: italic;
            text-align: center;
            margin: 60px auto;
            max-width: 600px;
            font-weight: 300;
        }

        .tracks {
            margin: 80px 0;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .track-wrapper {
            position: relative;
            opacity: 0;
            animation: slideIn 0.8s ease forwards;
        }

        .track-wrapper:nth-child(1) { animation-delay: 0.2s; }
        .track-wrapper:nth-child(2) { animation-delay: 0.4s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Градиентный слой за виджетом */
        .track-gradient-layer {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 30px;
            z-index: 1;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Первый трек - коричневый */
        .track-wrapper:nth-child(1) .track-gradient-layer {
            background: linear-gradient(135deg, 
                rgba(111, 65, 0, 0.35) 0%,
                rgba(111, 65, 0, 0.15) 50%,
                transparent 100%);
            box-shadow: 
                0 10px 40px rgba(111, 65, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Второй трек - синий */
        .track-wrapper:nth-child(2) .track-gradient-layer {
            background: linear-gradient(135deg, 
                rgba(30, 78, 130, 0.35) 0%,
                rgba(30, 78, 130, 0.15) 50%,
                transparent 100%);
            box-shadow: 
                0 10px 40px rgba(30, 78, 130, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Стеклянный контейнер */
        .track-item {
            position: relative;
            z-index: 2;
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 25px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Первый трек - тёмно-коричневое стекло */
        .track-wrapper:nth-child(1) .track-item {
            background: rgba(70, 40, 0, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.06);
        }

        /* Второй трек - тёмно-синее стекло */
        .track-wrapper:nth-child(2) .track-item {
            background: rgba(20, 50, 80, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.06);
        }

        .track-wrapper:hover .track-gradient-layer {
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
        }

        .track-wrapper:nth-child(1):hover .track-gradient-layer {
            box-shadow: 
                0 15px 60px rgba(111, 65, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .track-wrapper:nth-child(2):hover .track-gradient-layer {
            box-shadow: 
                0 15px 60px rgba(30, 78, 130, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .track-wrapper:hover .track-item {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .track-wrapper:nth-child(1):hover .track-item {
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
        }

        .track-wrapper:nth-child(2):hover .track-item {
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
        }

        .track-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #b8b8b8;
            font-weight: 300;
            letter-spacing: 1px;
        }

        iframe {
            border-radius: 15px;
            width: 100%;
            border: none;
            display: block;
            filter: brightness(0.9);
            transition: filter 0.3s ease;
        }

        iframe:hover {
            filter: brightness(1);
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Первая группа - Spotify, Яндекс.Музыка, VK Музыка */
        .primary-links {
            margin: 100px 0 30px;
        }

        /* Вторая группа - VK и Почта */
        .tertiary-links {
            margin: 20px 0 60px;
            gap: 20px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 36px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 60px;
            color: #c8c8c8;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1em;
            font-weight: 400;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Градиентная заливка снизу вверх */
        .link-btn::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0;
            z-index: -1;
            transition: height 0.8s cubic-bezier(0.2, 0, 0.3, 1);
        }

        /* Светящийся эффект */
        .link-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: -2;
            transition: opacity 0.6s ease;
        }


        .link-btn:hover::before {
            height: 100%;
            transition: height 0.8s cubic-bezier(0.2, 0, 0.3, 1) 0.15s;
        }

        .link-btn:hover::after {
            opacity: 1;
        }

        /* Первая группа - Spotify */
        .primary-links .link-btn:nth-child(1)::before {
            background: linear-gradient(to top, rgba(61, 90, 79, 0.8), rgba(61, 90, 79, 0.2));
        }

        .primary-links .link-btn:nth-child(1)::after {
            background: radial-gradient(circle at center, rgba(93, 212, 163, 0.3), transparent 70%);
            box-shadow: inset 0 0 30px rgba(93, 212, 163, 0.6), inset 0 0 15px rgba(93, 212, 163, 0.8);
        }

        .primary-links .link-btn:nth-child(1):hover {
            background: rgba(61, 90, 79, 0.15);
            border-color: rgba(61, 90, 79, 0.5);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 8px 32px rgba(61, 90, 79, 0.4),
                0 0 40px rgba(61, 90, 79, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Первая группа - Яндекс.Музыка */
        .primary-links .link-btn:nth-child(2)::before {
            background: linear-gradient(to top, rgba(180, 120, 30, 0.8), rgba(180, 120, 30, 0.2));
        }

        .primary-links .link-btn:nth-child(2)::after {
            background: radial-gradient(circle at center, rgba(255, 215, 100, 0.4), transparent 70%);
            box-shadow: inset 0 0 30px rgba(255, 215, 100, 0.7), inset 0 0 15px rgba(255, 215, 100, 0.9);
        }

        .primary-links .link-btn:nth-child(2):hover {
            background: rgba(180, 120, 30, 0.2);
            border-color: rgba(255, 215, 100, 0.6);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 8px 32px rgba(255, 215, 100, 0.5),
                0 0 40px rgba(255, 215, 100, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Первая группа - VK Музыка */
        .primary-links .link-btn:nth-child(3)::before {
            background: linear-gradient(to top, rgba(30, 50, 90, 0.8), rgba(30, 50, 90, 0.2));
        }

        .primary-links .link-btn:nth-child(3)::after {
            background: radial-gradient(circle at center, rgba(71, 126, 232, 0.3), transparent 70%);
            box-shadow: inset 0 0 30px rgba(71, 126, 232, 0.6), inset 0 0 15px rgba(71, 126, 232, 0.8);
        }

        .primary-links .link-btn:nth-child(3):hover {
            background: rgba(30, 50, 90, 0.15);
            border-color: rgba(71, 126, 232, 0.5);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 8px 32px rgba(71, 126, 232, 0.4),
                0 0 40px rgba(71, 126, 232, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Вторая группа - VK */
        .tertiary-links .link-btn:nth-child(1)::before {
            background: linear-gradient(to top, rgba(37, 85, 101, 0.8), rgba(37, 85, 101, 0.2));
        }

        .tertiary-links .link-btn:nth-child(1)::after {
            background: radial-gradient(circle at center, rgba(74, 200, 232, 0.3), transparent 70%);
            box-shadow: inset 0 0 30px rgba(74, 200, 232, 0.6), inset 0 0 15px rgba(74, 200, 232, 0.8);
        }

        .tertiary-links .link-btn:nth-child(1):hover {
            background: rgba(37, 85, 101, 0.15);
            border-color: rgba(37, 85, 101, 0.5);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 8px 32px rgba(37, 85, 101, 0.4),
                0 0 40px rgba(37, 85, 101, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Третья группа - Почта */
        .tertiary-links .link-btn:nth-child(2)::before {
            background: linear-gradient(to top, rgba(103, 58, 183, 0.8), rgba(103, 58, 183, 0.2));
        }

        .tertiary-links .link-btn:nth-child(2)::after {
            background: radial-gradient(circle at center, rgba(149, 117, 205, 0.3), transparent 70%);
            box-shadow: inset 0 0 30px rgba(149, 117, 205, 0.6), inset 0 0 15px rgba(149, 117, 205, 0.8);
        }

        .tertiary-links .link-btn:nth-child(2):hover {
            background: rgba(103, 58, 183, 0.15);
            border-color: rgba(103, 58, 183, 0.5);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                0 8px 32px rgba(103, 58, 183, 0.4),
                0 0 40px rgba(103, 58, 183, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }


        .link-btn svg {
            width: 22px;
            height: 22px;
            opacity: 0.8;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
            transition: opacity 0.3s ease;
        }

        .link-btn:hover svg {
            opacity: 1;
        }

        /* Секция для сотрудничества */
        .collaboration-label {
            text-align: center;
            font-size: 0.9em;
            color: #777;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 300;
            text-transform: uppercase;
        }

        footer {
            text-align: center;
            padding: 60px 20px 80px;
            color: #5a5a5a;
            font-size: 0.85em;
            font-weight: 300;
            letter-spacing: 1px;
            position: relative;
            margin: 0;
        }

        .copyright {
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s ease;
            user-select: none;
            position: relative;
            z-index: 1;
        }

        .copyright:hover {
            color: #888;
        }

        .hidden-socials {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                opacity 0.4s ease,
                margin-top 0.5s ease;
            opacity: 0;
            margin-top: 0;
        }

        .hidden-socials.show {
            max-height: 100px;
            opacity: 1;
            margin-top: 30px;
        }

        .social-links-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-link:nth-child(1)::before {
            background: radial-gradient(circle, rgba(29, 161, 242, 0.3), transparent 70%);
        }

        .social-link:nth-child(2)::before {
            background: radial-gradient(circle, rgba(0, 136, 204, 0.3), transparent 70%);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:hover {
            transform: translateY(-3px) scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            fill: #c8c8c8;
            transition: fill 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .social-link:hover svg {
            fill: #ffffff;
        }

        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 60px auto;
        }

        /* Эффект декодирования текста */
        @keyframes glitchChar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .decoding {
            display: inline-block;
            position: relative;
        }

        .decoding-char {
            display: inline-block;
            animation: glitchChar 0.1s ease-in-out;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.8em;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 1em;
            }

            .bio-text {
                font-size: 1.1em;
            }

            header {
                padding: 60px 20px 40px;
            }

            .lang-btn {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 100;
            }

            .links {
                flex-direction: column;
                align-items: stretch;
            }

            .link-btn {
                justify-content: center;
            }

            .track-item,
            .track-gradient-layer {
                border-radius: 20px;
            }
        }
    </style>
</head>

    <script>
        let clickCount = 0;
        let clickTimer = null;
        let currentLang = 'ru'; // Изначально русский

        // Символы Standard Galactic Alphabet
        const galacticChars = ['ᔑ', 'ʖ', 'ᓵ', 'ᓭ', 'ᒷ', 'リ', '⊣', '⍑', 'ᒲ', 'リ', '𝙹', '!¡', 'ᑑ', '∷', 'ᓭ', 'ℸ', '⚍', '⍊', '∴', 'ℸ', '||', '⨅'];

        function getRandomGalacticChar() {
            return galacticChars[Math.floor(Math.random() * galacticChars.length)];
        }

        function decodeText(element, finalText, duration = 800) {
            const textLength = finalText.length;
            const iterations = 15;
            const iterationDelay = duration / iterations;
            let currentIteration = 0;

            const interval = setInterval(() => {
                let newText = '';
                const progress = currentIteration / iterations;
                
                for (let i = 0; i < textLength; i++) {
                    const charProgress = i / textLength;
                    
                    if (charProgress < progress) {
                        newText += finalText[i];
                    } else {
                        if (finalText[i] !== ' ') {
                            newText += getRandomGalacticChar();
                        } else {
                            newText += ' ';
                        }
                    }
                }
                
                element.textContent = newText;
                currentIteration++;
                
                if (currentIteration > iterations) {
                    clearInterval(interval);
                    element.textContent = finalText;
                }
            }, iterationDelay);
        }

        function toggleHiddenSocials() {
            clickCount++;
            
            // Сбрасываем счётчик через 1 секунду, если кликов меньше 3
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 1000);

            // Если кликнули 3 раза
            if (clickCount === 3) {
                const hiddenSocials = document.getElementById('hiddenSocials');
                const body = document.body;
                
                hiddenSocials.classList.toggle('show');
                body.classList.toggle('gradient-active');
                
                clickCount = 0;
            }
        }

        function switchLanguage() {
            const langBtn = document.getElementById('langBtn');
            
            langBtn.classList.add('transitioning');
            const newLang = currentLang === 'ru' ? 'en' : 'ru';
            
            setTimeout(() => {
                langBtn.textContent = newLang === 'ru' ? 'EN' : 'RU';
            }, 300);
            
            setTimeout(() => {
                document.querySelectorAll('[data-ru][data-en]').forEach(element => {
                    const finalText = newLang === 'ru' 
                        ? element.getAttribute('data-ru') 
                        : element.getAttribute('data-en');
                    
                    decodeText(element, finalText, 800);
                });
                
                currentLang = newLang;
            }, 300);
            
            setTimeout(() => {
                langBtn.classList.remove('transitioning');
            }, 1200);
        }
    </script>

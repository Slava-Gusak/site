<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slava_Gusak — Дебри</title>
    <style>
        html {
            overscroll-behavior: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            overscroll-behavior: none;
            background: #0f0f23;
            transition: background 60s linear;
        }

        /* ===== ФОН: три слоя ===== */

        /* Слой 2: шумовая текстура для глубины */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            opacity: 0.035;
            pointer-events: none;
        }

        /* Слой 3: виньетка по краям */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
            pointer-events: none;
        }

        /* ===== ПЛАВАЮЩИЕ БЛИКИ ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            transition: background 60s linear, opacity 2s ease;
        }
        .glow-orb-1 { width: 500px; height: 500px; top: -100px; left: -100px; }
        .glow-orb-2 { width: 400px; height: 400px; bottom: -80px; right: -80px; }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== КНОПКА ЯЗЫКА ===== */
        .lang-btn {
            position: fixed;
            top: 64px;
            right: 20px;
            z-index: 100;
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.1);
            color: #ffffff;
            width: 60px;
            height: 36px;
            padding: 0;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            text-transform: uppercase;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .lang-btn:hover {
            border-color: rgba(255,255,255,0.2);
            transform: scale(1.05);
            background: rgba(255,255,255,0.12);
        }

        /* ===== БУРГЕР ===== */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.1);
            width: 60px;
            height: 36px;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .menu-btn:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.12);
            transform: scale(1.05);
        }
        .menu-btn span {
            width: 20px;
            height: 2px;
            background: #ffffff;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            opacity: 0.85;
        }
        .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ===== МЕНЮ ===== */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 98;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .menu-overlay.active { opacity: 1; visibility: visible; }

        .menu {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            background: rgba(10, 5, 20, 0.88);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 99;
            transition: top 0.4s cubic-bezier(0.4,0,0.2,1);
            padding: 28px 40px 30px;
        }
        .menu.active { top: 0; }

        .menu-items {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }
        .menu-items a {
            font-size: 1.4em;
            font-weight: 300;
            letter-spacing: 3px;
            color: #c8c8c8;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }
        .menu-items a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: rgba(255,255,255,0.4);
            transition: width 0.3s ease;
        }
        .menu-items a:hover { color: #ffffff; }
        .menu-items a:hover::after { width: calc(100% - 3px); }
        .menu-items a.active { color: #ffffff; }
        .menu-items a.active::after { width: calc(100% - 3px); background: rgba(255,255,255,0.6); }

        .menu-item-soon { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .soon-link { cursor: default !important; opacity: 0.5; }
        .soon-tag { font-size: 0.55em; letter-spacing: 2px; color: #666; text-transform: uppercase; font-weight: 300; line-height: 1; }
        .menu-item-with-sub { position: relative; }
        .menu-item-with-sub > a.no-underline::after { display: none; }
        .submenu-link.submenu-link {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            margin-top: 3px; font-size: 0.62em; letter-spacing: 1.5px; color: #777;
            text-transform: uppercase; font-weight: 300; line-height: 1; white-space: nowrap;
            text-decoration: none; opacity: 0.65; transition: opacity 0.25s ease, color 0.25s ease;
        }
        .menu-item-with-sub:hover .submenu-link:not(.soon-link),
        .submenu-link:focus:not(.soon-link),
        .submenu-link:hover:not(.soon-link) { opacity: 1; color: #fff; }
        .submenu-link.soon-link { opacity: 0.5 !important; }
        .submenu-link.warren-link.active { opacity: 1 !important; color: #fff; }
        .submenu-link.warren-link.active::after { content: none; }

        .warren-charging { animation: warrenShake 0.5s ease-in-out infinite; }
        @keyframes warrenShake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-2px,1px); }
            40% { transform: translate(2px,-1px); }
            60% { transform: translate(-1px,-2px); }
            80% { transform: translate(1px,2px); }
        }
        .warren-glow {
            position: absolute; inset: -14px; border-radius: 16px; pointer-events: none;
            z-index: -1; opacity: 0; background: radial-gradient(circle, rgba(140,195,255,0.55), transparent 70%);
            filter: blur(6px); transition: opacity 0.1s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-6px); }
            35% { transform: translateX(6px); }
            55% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
            90% { transform: translateX(-2px); }
        }
        .shaking { animation: shake 0.4s ease; }

        .placeholder-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .placeholder-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .menu-items { flex-direction: column; gap: 24px; }
            .menu-items a { font-size: 1.3em; }
            .menu-items a.no-underline { font-size: 1.95em; }
            .submenu-link.submenu-link { font-size: 0.93em; }
            .menu-item-with-sub { margin-bottom: 14px; }
        }
    </style>
</head>
<body>
    <!-- Плавающие блики -->
    <div class="glow-orb glow-orb-1" id="orb1"></div>
    <div class="glow-orb glow-orb-2" id="orb2"></div>

    <button class="lang-btn" id="langBtn" onclick="switchLanguage()">EN</button>

    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <nav class="menu" id="mainMenu">
        <ul class="menu-items">
            <li><a href="../music/index.html" data-ru="Музыка" data-en="Music">Музыка</a></li>
            <li class="menu-item-with-sub menu-item-soon">
                <a href="#" class="no-underline soon-link" id="homeLink" data-ru="Главная" data-en="Home" onclick="return false;">
                    <span class="warren-glow" id="warrenGlow"></span>Главная
                </a>
                <a href="index.html" class="submenu-link warren-link active" id="warrenLink" data-ru="Дебри" data-en="Warren">Дебри</a>
            </li>
            <li><a href="../gallery/index.html" data-ru="Галерея" data-en="Gallery">Галерея</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="placeholder-box">
            <img src="error.png" alt="error" data-ru-alt="ошибка" data-en-alt="error">
        </div>
    </div>

    <script>
        function initOrbs() {
            const o1 = document.getElementById('orb1'), o2 = document.getElementById('orb2');
            document.body.style.background = 'linear-gradient(135deg, rgb(20,8,35) 0%, rgb(40,12,55) 50%, rgb(15,5,28) 100%)';
            o1.style.background = 'rgba(120,40,100,0.35)';
            o2.style.background = 'rgba(20,90,70,0.3)';
            o1.style.opacity = '1';
            o2.style.opacity = '1';
        }
        initOrbs();

        function toggleMenu() {
            document.getElementById('mainMenu').classList.toggle('active');
            document.getElementById('menuOverlay').classList.toggle('active');
            document.getElementById('menuBtn').classList.toggle('open');
        }

        let currentLang = 'ru';
        function switchLanguage() {
            const newLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('langBtn').textContent = newLang === 'ru' ? 'EN' : 'RU';
            document.querySelectorAll('[data-ru][data-en]').forEach(el => {
                el.textContent = newLang === 'ru' ? el.getAttribute('data-ru') : el.getAttribute('data-en');
            });
            currentLang = newLang;
        }

        function shakeSoon(el) {
            el.classList.remove('shaking'); void el.offsetWidth; el.classList.add('shaking');
            el.addEventListener('animationend', () => el.classList.remove('shaking'), { once: true });
        }

        /* ГЛАВНАЯ — здесь по-прежнему недоступна, трясётся на клик/попытку удержания */
        (function initHomeLock() {
            const homeLink = document.getElementById('homeLink');
            const glow = document.getElementById('warrenGlow');
            if (!homeLink || !glow) return;

            const HOLD_MS = 3000, GROW_MS = 3000;
            let holdTimer = null, growStart = null, growRaf = null, pressedHome = false;

            function resetGlow() {
                cancelAnimationFrame(growRaf); growRaf = null;
                homeLink.classList.remove('warren-charging');
                glow.style.opacity = '0';
            }
            function cancelHold() {
                const wasCharging = homeLink.classList.contains('warren-charging');
                const wasPending = holdTimer !== null;
                pressedHome = false;
                clearTimeout(holdTimer); holdTimer = null;
                resetGlow();
                if (wasPending || wasCharging) shakeSoon(homeLink);
            }
            function growStep(ts) {
                if (!growStart) growStart = ts;
                const progress = Math.min((ts - growStart) / GROW_MS, 1);
                glow.style.opacity = String(progress);
                if (progress < 1) { growRaf = requestAnimationFrame(growStep); }
                else { resetGlow(); shakeSoon(homeLink); }
            }
            function startGrow() {
                growStart = null;
                homeLink.classList.add('warren-charging');
                growRaf = requestAnimationFrame(growStep);
            }
            function startHold(e) {
                if (e.type === 'mousedown' && e.button !== 0) return;
                pressedHome = true;
                holdTimer = setTimeout(startGrow, HOLD_MS);
            }

            homeLink.addEventListener('mousedown', startHold);
            homeLink.addEventListener('touchstart', startHold, { passive: true });
            document.addEventListener('mouseup', cancelHold);
            document.addEventListener('touchend', cancelHold);
            document.addEventListener('touchcancel', cancelHold);
        })();
    </script>
</body>
</html>
